
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>motiq - Animation Tests</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 15px;
    }

    /* Opacity Animation */

    .box {
      width: 150px;
      height: 150px;
      background: #7155e8;
      border-radius: 12px;
      opacity: 0;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    /* Sections */

    .section {
      width: 100%;
      padding: 50px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Marquee Animation */

    .marquee {
      width: 100%;
      margin: 30px 0;
      overflow: hidden;
    }

    .card {
      width: 220px;
      height: 150px;
      flex-shrink: 0;
      background: #7155e8;
      color: white;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .card:nth-child(2) {
      background: #168b85;
    }

    .card:nth-child(3) {
      background: #bc624f;
    }

    .card:nth-child(4) {
      background: #3469a5;
    }

    .card:nth-child(5) {
      background: #d29a28;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .controls button {
      margin-top: 0;
    }

    p {
      color: #666;
    }
  </style>
</head>

<body>

  <h1>motiq Animation Library</h1>

  <!-- OPACITY ANIMATION -->

  <section class="section">

    <h2>Opacity Animation</h2>

    <div class="box"></div>

    <button id="animateBtn">
      Animate Opacity
    </button>

  </section>

  <!-- MARQUEE ANIMATION -->

  <section class="section">

    <h2>Marquee Animation</h2>

    <p>Hover over a card to pause the animation</p>

    <div class="marquee">
      <div class="card">HTML</div>
      <div class="card">CSS</div>
      <div class="card">JavaScript</div>
      <div class="card">motiq</div>
      <div class="card">Animations</div>
    </div>

    <div class="controls">
      <button id="pauseBtn">Pause</button>
      <button id="playBtn">Play</button>
      <button id="destroyBtn">Destroy</button>
    </div>

  </section>

  <script type="module">

    import motiq from "./src/index.js";

    // -----------------------------
    // OPACITY ANIMATION
    // -----------------------------

    const box = document.querySelector(".box");
    const animateBtn = document.querySelector("#animateBtn");

    animateBtn.addEventListener("click", () => {

      // Reset opacity
      box.style.opacity = 0;

      // Animate using motiq
      motiq.to(box, {
        opacity: 1,
        duration: 1500
      });

    });


    // -----------------------------
    // MARQUEE ANIMATION
    // -----------------------------

    const marquee = motiq.marquee(".marquee", {
      speed: 80,
      direction: "left",
      gap: 20,
      pauseOnHover: true
    });


    // Pause marquee
    document.querySelector("#pauseBtn")
      .addEventListener("click", () => {
        marquee.pause();
      });


    // Resume marquee
    document.querySelector("#playBtn")
      .addEventListener("click", () => {
        marquee.play();
      });


    // Destroy marquee
    document.querySelector("#destroyBtn")
      .addEventListener("click", () => {
        marquee.destroy();
      });

  </script>

</body>
</html>
