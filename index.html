
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motiq - Opacity Test</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      width: 150px;
      height: 150px;
      background: #7155e8;
      border-radius: 12px;
      opacity: 0;
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>motiq - Opacity Animation</h1>

  <div class="box"></div>

  <button id="animateBtn">Animate</button>

  <script type="module">
    import motiq from "./src/index.js";

    const box = document.querySelector(".box");
    const button = document.querySelector("#animateBtn");

    button.addEventListener("click", () => {
      // Reset opacity before starting
      box.style.opacity = 0;

      // Animate using motiq
      motiq.to(box, {
        opacity: 1,
        duration: 1500
      });
    });
  </script>

</body>
</html>
